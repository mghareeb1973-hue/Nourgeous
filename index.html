<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nourgeous accessories</title>
  <style>
    :root {
      --bg: #fdfaf7;
      --card: #ffffff;
      --text: #2c221e;
      --muted: #7a6b63;
      --accent: #b8866b;
      --accent-dark: #96684f;
      --badge: #d9534f;
      --border: #efe4dc;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { font-size: 1.4rem; font-weight: 700; color: var(--accent-dark); letter-spacing: 0.5px; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn-outline {
      background: transparent;
      color: var(--accent-dark);
      border: 1px solid var(--accent);
    }
    .btn-danger { background: var(--badge); }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      color: var(--text);
    }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }
    .discount-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--badge);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #f5ebe4;
    }
    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .cat-tag { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin: 4px 0; }
    .card-note { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; flex: 1; }
    .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .final-price { font-size: 1.15rem; font-weight: 700; color: var(--accent-dark); }
    .old-price { font-size: 0.85rem; color: var(--muted); text-decoration: line-through; }
    .admin-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }
    .admin-panel.open { display: block; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .status-bar { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Nourgeous accessories</div>
    <div>
      <button id="adminToggleBtn" class="btn btn-outline">Admin Login</button>
    </div>
  </header>

  <div class="container">
    <div id="syncStatus" class="status-bar">Connecting to cloud store...</div>

    <section id="adminPanel" class="admin-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="margin:0;">Store Admin Dashboard (Cloud Synced)</h3>
        <button id="logoutBtn" class="btn btn-outline">Exit Admin</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div>
            <label>Product Name</label>
            <input type="text" id="prodName" placeholder="e.g. Gold Hoop Earrings" required />
          </div>
          <div>
            <label>Category</label>
            <select id="prodCategory">
              <option value="Earrings">Earrings</option>
              <option value="Necklaces">Necklaces</option>
              <option value="Bracelets & Rings">Bracelets & Rings</option>
              <option value="Sets & Other">Sets & Other</option>
            </select>
          </div>
          <div>
            <label>Original Price (EGP)</label>
            <input type="number" id="prodPrice" min="1" step="0.01" placeholder="250" required />
          </div>
          <div>
            <label>Discount (%)</label>
            <input type="number" id="prodDiscountPct" min="0" max="99" step="1" value="0" required />
          </div>
          <div>
            <label>Product Image</label>
            <input type="file" id="prodImageFile" accept="image/*" />
          </div>
        </div>
        <div style="margin-bottom:12px;">
          <input type="text" id="prodNote" placeholder="Short product description..." />
        </div>
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn" id="saveBtn">Save to Cloud</button>
          <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
        </div>
      </form>
    </section>

    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" data-cat="All">All</button>
      <button class="filter-btn" data-cat="Earrings">Earrings</button>
      <button class="filter-btn" data-cat="Necklaces">Necklaces</button>
      <button class="filter-btn" data-cat="Bracelets & Rings">Bracelets & Rings</button>
      <button class="filter-btn" data-cat="Sets & Other">Sets & Other</button>
    </div>

    <div class="grid" id="productsGrid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsABFBe0tAz8uEOrmvjy03AU3VY6EvLY",
      authDomain: "nourgeous-store.firebaseapp.com",
      projectId: "nourgeous-store",
      storageBucket: "nourgeous-store.firebasestorage.app",
      messagingSenderId: "258894369123",
      appId: "1:258894369123:web:f9dd3a6d14b88e89584356",
      measurementId: "G-Y1G9HM1KYW"
    };

    const ADMIN_PIN = "1234"; // Change to your private admin PIN
    const WHATSAPP_NUMBER = "201000000000"; // Replace with your WhatsApp number (country code + number)

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsCol = collection(db, "products");

    let allProducts = [];
    let currentCategory = "All";
    let isAdmin = false;
    let currentEditingImage = "";

    const grid = document.getElementById("productsGrid");
    const syncStatus = document.getElementById("syncStatus");
    const adminPanel = document.getElementById("adminPanel");
    const adminToggleBtn = document.getElementById("adminToggleBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const productForm = document.getElementById("productForm");

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 600;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    onSnapshot(productsCol, (snapshot) => {
      allProducts = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      allProducts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      syncStatus.textContent = `Live Cloud Store • ${allProducts.length} item(s) available`;
      renderProducts();
    }, (err) => {
      syncStatus.textContent = "Cloud connection error. Check Firestore Rules.";
      console.error(err);
    });

    function renderProducts() {
      const filtered = currentCategory === "All"
        ? allProducts
        : allProducts.filter((p) => p.category === currentCategory);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:var(--muted);">No products in this category yet.</p>`;
        return;
      }

      grid.innerHTML = filtered.map((p) => {
        const orig = Number(p.originalPrice) || 0;
        const pct = Math.min(99, Math.max(0, Number(p.discountPct) || 0));
        const finalPrice = Math.round(orig * (1 - pct / 100));
        const imgSrc = p.image || "https://via.placeholder.com/400x400/f5ebe4/96684f?text=Nourgeous";
        const orderMsg = encodeURIComponent(`Hello Nourgeous accessories! I would like to order: ${p.name} (${finalPrice} EGP)`);

        return `
          <div class="card">
            ${pct > 0 ? `<div class="discount-badge">-${pct}% OFF</div>` : ""}
            <img src="${imgSrc}" alt="${p.name}" />
            <div class="card-body">
              <div class="cat-tag">${p.category || "Accessories"}</div>
              <div class="card-title">${p.name}</div>
              <div class="card-note">${p.note || ""}</div>
              <div class="price-row">
                <span class="final-price">${finalPrice} EGP</span>
                ${pct > 0 ? `<span class="old-price">${orig} EGP</span>` : ""}
              </div>
              <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${orderMsg}" target="_blank" class="btn" style="text-align:center;text-decoration:none;">Order via WhatsApp</a>
              ${isAdmin ? `
                <div style="display:flex;gap:8px;margin-top:8px;">
                  <button class="btn btn-outline" style="flex:1;" onclick="window.editProduct('${p.id}')">Edit</button>
                  <button class="btn btn-danger" style="flex:1;" onclick="window.deleteProduct('${p.id}')">Delete</button>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    adminToggleBtn.addEventListener("click", () => {
      if (isAdmin) {
        adminPanel.classList.toggle("open");
        return;
      }
      const pin = prompt("Enter Admin PIN:");
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        adminPanel.classList.add("open");
        adminToggleBtn.textContent = "Admin Panel";
        renderProducts();
      } else if (pin !== null) {
        alert("Incorrect PIN.");
      }
    });

    logoutBtn.addEventListener("click", () => {
      isAdmin = false;
      adminPanel.classList.remove("open");
      adminToggleBtn.textContent = "Admin Login";
      renderProducts();
    });

    document.getElementById("categoryFilters").addEventListener("click", (e) => {
      if (!e.target.classList.contains("filter-btn")) return;
      document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      e.target.classList.add("active");
      currentCategory = e.target.dataset.cat;
      renderProducts();
    });

    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try {
        const id = document.getElementById("editId").value || `prod-${Date.now()}`;
        const fileInput = document.getElementById("prodImageFile");
        let imageData = currentEditingImage;

        if (fileInput.files && fileInput.files[0]) {
          imageData = await compressImage(fileInput.files[0]);
        }

        await setDoc(doc(db, "products", id), {
          id,
          name: document.getElementById("prodName").value.trim(),
          category: document.getElementById("prodCategory").value,
          originalPrice: Number(document.getElementById("prodPrice").value),
          discountPct: Number(document.getElementById("prodDiscountPct").value),
          note: document.getElementById("prodNote").value.trim(),
          image: imageData,
          updatedAt: Date.now()
        });

        resetForm();
      } catch (err) {
        alert("Failed to save product. Make sure Firestore Rules allow read/write.");
        console.error(err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save to Cloud";
      }
    });

    window.editProduct = (id) => {
      const p = allProducts.find((item) => item.id === id);
      if (!p) return;
      document.getElementById("editId").value = p.id;
      document.getElementById("prodName").value = p.name;
      document.getElementById("prodCategory").value = p.category;
      document.getElementById("prodPrice").value = p.originalPrice;
      document.getElementById("prodDiscountPct").value = p.discountPct || 0;
      document.getElementById("prodNote").value = p.note || "";
      currentEditingImage = p.image || "";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      adminPanel.classList.add("open");
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.deleteProduct = async (id) => {
      if (!confirm("Delete this product from the store for all users?")) return;
      await deleteDoc(doc(db, "products", id));
    };

    function resetForm() {
      productForm.reset();
      document.getElementById("editId").value = "";
      currentEditingImage = "";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);
  </script>
</body>
</html>
